<nav class="navbar navbar-expand-lg custom-navbar">
  <div class="container-fluid">
      <div class="navbar-nav">
      @for (item of menu; track item.url) {
        <a 
          class="nav-link"
          [routerLink]="item.url"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true}">
          
          {{ item.content }}
        </a>
      }
      </div>
    </div>
</nav>
